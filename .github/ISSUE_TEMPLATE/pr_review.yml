{
  "name": "PR 검토 수정 요청",
  "description": "별도 추적이 필요하고 한 PR의 병합으로 완료되는 검토 요청입니다. 일반 수정은 PR 리뷰를 사용합니다.",
  "title": "[PR 검토] ",
  "labels": [
    "pr-review"
  ],
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "현재 PR에서 끝나는 수정은 PR 리뷰·수정 요청으로 처리하세요. 이 양식은 별도 추적이 필요하며 지정한 한 PR의 병합으로 완료되는 경우만 사용합니다. 여러 PR·후속 단계 검증이 남는 버그·기능은 일반 작업 Issue를 사용하고 pr-review 라벨을 붙이지 마세요. 비밀번호·토큰·실제 DB 자료는 제외합니다."
      }
    },
    {
      "type": "input",
      "id": "related_pr",
      "attributes": {
        "label": "관련 PR",
        "description": "자동 종료 대상인 PR 하나를 정확히 입력합니다. 같은 저장소의 PR URL 또는 #번호 형식입니다.",
        "placeholder": "https://github.com/Esp3ra/2026-Moble-3rd-Team-Project/pull/번호"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "dropdown",
      "id": "target_branch",
      "attributes": {
        "label": "PR 대상 브랜치",
        "options": [
          "Alpha",
          "Beta",
          "Release",
          "main"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "problem",
      "attributes": {
        "label": "문제와 별도 추적이 필요한 이유",
        "placeholder": "현재 동작, 기대한 동작, 사용자·기존 기능에 미치는 영향을 적어주세요."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "reproduction",
      "attributes": {
        "label": "발생 조건과 확인 위치",
        "placeholder": "재현 순서, 관련 파일·줄 번호, 확인한 커밋을 적어주세요. 재현하지 못했다면 그 사실을 구분해주세요."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "acceptance",
      "attributes": {
        "label": "수정 완료 조건",
        "placeholder": "무엇을 수정·검증하면 이 PR의 병합으로 종료할 수 있는지 적어주세요. 다른 PR이나 후속 단계 검증이 필요하면 일반 작업 Issue를 사용하세요."
      },
      "validations": {
        "required": true
      }
    }
  ]
}
