name: WPF skeleton build
on:
  push:
    paths: ['WPF/**', 'demos/mobot/WPF-CameraPreview/**', '.github/workflows/wpf-skeleton-build.yml']
  pull_request:
    paths: ['WPF/**', 'demos/mobot/WPF-CameraPreview/**', '.github/workflows/wpf-skeleton-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build WPF/RobotFactory.sln --configuration Release --nologo
      - run: dotnet build demos/mobot/WPF-CameraPreview/RobotFactory.sln --configuration Release --nologo
