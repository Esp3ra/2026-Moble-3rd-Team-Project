name: Pallet transfer firmware build

on:
  pull_request:
    branches: [Alpha, Beta, Release]
  push:
    branches: [Alpha, Beta, Release]

permissions:
  contents: read

jobs:
  compile-uno:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test firmware state transitions without hardware
        shell: bash
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -I firmware/tests \
            firmware/tests/pallet_transfer_test.cpp -o "$RUNNER_TEMP/pallet-transfer-test"
          for scenario in demo no-heartbeat link-loss completion ir2-blocked operator-stop; do
            "$RUNNER_TEMP/pallet-transfer-test" "$scenario"
          done
      - name: Install Arduino CLI 1.5.1
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/arduino/arduino-cli/releases/download/v1.5.1/arduino-cli_1.5.1_Linux_64bit.tar.gz -o "$RUNNER_TEMP/arduino-cli.tar.gz"
          mkdir -p "$RUNNER_TEMP/arduino-cli-bin"
          tar -xzf "$RUNNER_TEMP/arduino-cli.tar.gz" -C "$RUNNER_TEMP/arduino-cli-bin" arduino-cli
          echo "$RUNNER_TEMP/arduino-cli-bin" >> "$GITHUB_PATH"
      - name: Compile for UNO
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8
          arduino-cli compile --fqbn arduino:avr:uno firmware/RobotWorkSimulation
