name: Factory v1 validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        working-directory: server/mobot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -B -m unittest discover -s tests
      - run: python -B scripts/check_openapi.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: dotnet build ../../WPF/RobotFactory.sln -c Release --nologo
      - run: dotnet run --project ../../WPF/RobotFactory.Regression -c Release
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.6.0'
      - run: arduino-cli core update-index
      - run: arduino-cli core install arduino:avr@1.8.8
      - run: python -B scripts/check_uno_firmware.py
