name: Repository policy

on:
  pull_request:
    branches: [main, Alpha, Beta, Release]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main, Alpha, Beta, Release]
    tags: ['*V']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: repository-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test collaboration policy
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Check repository and PR policy
        run: python3 scripts/check_repository.py
