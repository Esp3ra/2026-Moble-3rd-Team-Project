name: UNO firmware build

on:
  pull_request:
    branches: [Alpha, Beta, Release]
  push:
    branches: [Alpha, Beta, Release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-uno:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - sketch: ConveyorActuatorController
            actuator: disabled
          - sketch: ConveyorActuatorController
            actuator: enabled-compile-only
          - sketch: ActuatorJogTest
            actuator: not-applicable
          - sketch: ActuatorJogTest
            actuator: long-test-compile-only
          - sketch: OrderPalletFeeder
            actuator: dry-run
          - sketch: OrderPalletFeeder
            actuator: live-compile-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Arduino CLI 1.5.1
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/arduino/arduino-cli/releases/download/v1.5.1/arduino-cli_1.5.1_Linux_64bit.tar.gz -o "$RUNNER_TEMP/arduino-cli.tar.gz"
          mkdir -p "$RUNNER_TEMP/arduino-cli-bin"
          tar -xzf "$RUNNER_TEMP/arduino-cli.tar.gz" -C "$RUNNER_TEMP/arduino-cli-bin" arduino-cli
          echo "$RUNNER_TEMP/arduino-cli-bin" >> "$GITHUB_PATH"
      - name: Install pinned core and library
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8
          arduino-cli lib install "AccelStepper@1.64"
      - name: Prepare isolated compile copy
        env:
          SKETCH_NAME: ${{ matrix.sketch }}
          ACTUATOR_VARIANT: ${{ matrix.actuator }}
        shell: bash
        run: |
          cp -R "firmware/$SKETCH_NAME" "$RUNNER_TEMP/$SKETCH_NAME"
          if [ "$ACTUATOR_VARIANT" = "enabled-compile-only" ]; then
            sed -i 's/ACTUATOR_HARDWARE_VERIFIED = false/ACTUATOR_HARDWARE_VERIFIED = true/' "$RUNNER_TEMP/$SKETCH_NAME/Config.h"
          fi
          if [ "$ACTUATOR_VARIANT" = "long-test-compile-only" ]; then
            sed -i 's/END_CUTOFF_VERIFIED = false/END_CUTOFF_VERIFIED = true/' "$RUNNER_TEMP/$SKETCH_NAME/ActuatorJogTest.ino"
          fi
          if [ "$ACTUATOR_VARIANT" = "live-compile-only" ]; then
            sed -i 's/DRY_RUN = true/DRY_RUN = false/' "$RUNNER_TEMP/$SKETCH_NAME/Config.h"
          fi
      - name: Compile only, never upload
        run: arduino-cli compile --fqbn arduino:avr:uno "$RUNNER_TEMP/${{ matrix.sketch }}"

  feeder-state-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test feeder transitions without hardware
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic firmware/tests/feeder_logic_test.cpp -o "$RUNNER_TEMP/feeder-test"
          "$RUNNER_TEMP/feeder-test"
