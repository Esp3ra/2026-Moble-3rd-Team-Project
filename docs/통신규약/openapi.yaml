        '503':
          $ref: '#/components/responses/Error503'
components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      description: WPF 관리자 계정의 세션. 관리자 권한은 서버에서 확인한다.
    deviceToken:
      type: http
      scheme: bearer
      description: 이벤트 발행 장비 또는 메인 PC의 인증된 연결 모듈. 등록된 device_id와 대조한다.
    controllerToken:
      type: http
      scheme: bearer
      description: 단일 제어 주체인 메인 서버가 장비 연결 모듈을 호출할 때 사용한다.
  schemas:
    Id:
      type: string
      format: uuid
    Utc:
      type: string
      format: date-time
      pattern: Z$
    PalletId:
      type: string
      pattern: ^PALLET-0[1-8]$
    Hub:
      type: integer
      enum: [3, 4, 5]
    Destination:
      type: integer
      enum: [3, 4, 5, 6, 7]
    BuildSpec:
      type: object
      additionalProperties: false
      properties:
        target_head_id:
          type: string
          enum: [H1, H2]
        target_arm_l_id:
          type: string
          enum: [L1, L2, L3]
        target_arm_r_id:
          type: string
          enum: [R1, R2, R3]
      required: [target_head_id, target_arm_l_id, target_arm_r_id]
    SubmitOrder:
      type: object
      additionalProperties: false
      properties:
        request_id:
          $ref: '#/components/schemas/Id'
        company:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          minLength: 1
          maxLength: 40
        address:
          type: string
          minLength: 1
          maxLength: 300
        spec:
          $ref: '#/components/schemas/BuildSpec'
        payment_method:
          type: string
          enum: [card, transfer]
      required: [request_id, company, phone, address, spec, payment_method]
      examples:
      - request_id: f82afe44-7f3c-4ff0-9a09-b248440556d2
        company: 시연 회사
        phone: 000-0000-0000
        address: 광주광역시 서구 시연로 1
        spec:
          target_head_id: H1
          target_arm_l_id: L1
          target_arm_r_id: R1
        payment_method: card
    Request:
      type: object
      additionalProperties: false
      properties:
        request_id:
          $ref: '#/components/schemas/Id'
      required: [request_id]
    OrderLookup:
      type: object
      additionalProperties: false
      properties:
        order_id:
          $ref: '#/components/schemas/Id'
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
      required: [order_id]
    PublicCancel:
      type: object
      additionalProperties: false
      properties:
        order_id:
          $ref: '#/components/schemas/Id'
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
        request_id:
          $ref: '#/components/schemas/Id'
      required: [order_id, request_id]
    PublicOrder:
      type: object
      additionalProperties: false
      properties:
        order_id:
          $ref: '#/components/schemas/Id'
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
        spec:
          $ref: '#/components/schemas/BuildSpec'
        target_station:
          type: integer
          enum: [3, 4, 5]
        progress:
          type: string
          enum: [RECEIVED, IN_PRODUCTION, INSPECTING, SHIPPING, HUB_ARRIVED]
        outcome:
          type: string
          enum: [OPEN, NORMAL, ERROR, CANCELLED]
        updated_at:
          $ref: '#/components/schemas/Utc'
      required: [order_id, spec, target_station, progress, outcome, updated_at]
      examples:
      - order_id: 0e9b1d5e-00a7-4b34-9f11-316049eb2e5a
        spec:
          target_head_id: H1
          target_arm_l_id: L1
          target_arm_r_id: R1
        target_station: 5
        progress: RECEIVED
        outcome: OPEN
        updated_at: '2026-11-21T04:10:00Z'
    OrderState:
      type: string
      enum: [PENDING, QUEUED, IN_PROGRESS, COMPLETED, CANCELLED, ERROR_DELIVERED]
    AdminOrder:
      type: object
      additionalProperties: false
      properties:
        order_id:
          $ref: '#/components/schemas/Id'
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
        spec:
          $ref: '#/components/schemas/BuildSpec'
        company:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          minLength: 1
          maxLength: 40
        address:
          type: string
          minLength: 1
          maxLength: 300
        target_station:
          type: integer
          enum: [3, 4, 5]
        dispatch_station:
          anyOf:
          - type: integer
            enum: [3, 4, 5, 6, 7]
          - type: 'null'
        factory_status:
          $ref: '#/components/schemas/OrderState'
        approval_seq:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        cycle_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        pallet_id:
          anyOf:
          - type: string
            pattern: ^PALLET-0[1-8]$
          - type: 'null'
        created_at:
          $ref: '#/components/schemas/Utc'
        updated_at:
          $ref: '#/components/schemas/Utc'
      required: [order_id, spec, company, phone, address, target_station, dispatch_station, factory_status, approval_seq,
        cycle_id, pallet_id, created_at, updated_at]
    Pallet:
      type: object
      additionalProperties: false
      properties:
