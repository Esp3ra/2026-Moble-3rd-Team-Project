        verdict: PART_MISSING
        reasons: [PART_MISSING, QR_MISMATCH]
        dispatch_station: 6
        captured_at: '2026-11-21T04:10:15Z'
        frame_id: CAM3-0018
        image_ref: inspection-image-0018
