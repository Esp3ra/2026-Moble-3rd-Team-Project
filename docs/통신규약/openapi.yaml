    Inspection:
      type: object
      additionalProperties: false
      properties:
        order_id:
          $ref: '#/components/schemas/Id'
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
        inspection_id:
          $ref: '#/components/schemas/Id'
        cycle_id:
          $ref: '#/components/schemas/Id'
        expected_pallet_id:
          type: string
          pattern: ^PALLET-0[1-8]$
        verdict:
          type: string
          enum: [PASS, PART_MISSING, MISMATCH, INDETERMINATE]
        reasons:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [PART_MISSING, WRONG_PART, QR_MISMATCH, QR_UNREADABLE, OCCLUDED, NO_FRAME, LOW_CONFIDENCE]
        dispatch_station:
          type: integer
          enum: [3, 4, 5, 6, 7]
        captured_at:
          anyOf:
          - $ref: '#/components/schemas/Utc'
          - type: 'null'
        frame_id:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 128
          - type: 'null'
        image_ref:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 256
          - type: 'null'
        archive_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
      required: [order_id, inspection_id, cycle_id, expected_pallet_id, verdict, reasons, dispatch_station, captured_at,
        frame_id, image_ref]
      allOf:
      - if:
          properties:
            verdict:
              const: PASS
        then:
          properties:
            dispatch_station:
              type: integer
              enum: [3, 4, 5]
            reasons:
              maxItems: 0
        else:
          properties:
            reasons:
              minItems: 1
      - if:
          properties:
            verdict:
              const: PART_MISSING
        then:
          properties:
            dispatch_station:
              const: 6
            reasons:
              contains:
                const: PART_MISSING
      - if:
          properties:
            verdict:
              enum: [MISMATCH, INDETERMINATE]
        then:
          properties:
            dispatch_station:
              const: 7
            reasons:
              not:
                contains:
                  const: PART_MISSING
      - if:
          properties:
            reasons:
              contains:
                const: NO_FRAME
        then:
          properties:
            verdict:
              const: INDETERMINATE
            frame_id:
              type: 'null'
            image_ref:
              type: 'null'
            captured_at:
              type: 'null'
        else:
          properties:
            frame_id:
              type: string
              minLength: 1
              maxLength: 128
            image_ref:
              type: string
              minLength: 1
              maxLength: 256
            captured_at:
              $ref: '#/components/schemas/Utc'
      - if:
          properties:
            verdict:
              const: MISMATCH
        then:
          properties:
            reasons:
              contains:
                enum: [WRONG_PART, QR_MISMATCH]
      - if:
          properties:
            verdict:
              const: INDETERMINATE
        then:
          properties:
            reasons:
              contains:
                enum: [LOW_CONFIDENCE, OCCLUDED, NO_FRAME, QR_UNREADABLE]
      examples:
      - order_id: 0e9b1d5e-00a7-4b34-9f11-316049eb2e5a
        inspection_id: e615e433-ade0-4230-9502-644bf5adf080
        cycle_id: 72dd2d56-7363-4ca7-a48e-182c6f004ad9
