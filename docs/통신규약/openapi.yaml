openapi: 3.1.1
info:
  title: MOBOT 공통 통신 규약
  version: 0.1.0
  description: 2026-11-21 채택한 첫 통합 구현 기준. /api/v1은 메인 PC 업무 서버, /device/v1은 장비 연결 모듈이 제공한다. 구현 상태·기존 API와의 대응은 동봉된 Markdown을 따른다.
servers:
- url: /
tags:
- name: 구매 웹
- name: 인증
- name: 관제
- name: 운영
- name: 장비
- name: 이벤트
paths:
  /api/v1/catalog:
    get:
      operationId: getCatalog
      summary: 부품 옵션과 좌우 공용 재고
      tags: [구매 웹]
      security: []
      responses:
        '200':
          description: 조회 또는 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderOptions'
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/orders:
    post:
      operationId: submitOrder
      summary: 비회원 주문과 재고 차감
      tags: [구매 웹]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitOrder'
      responses:
        '200':
          description: 같은 요청의 기존 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicOrder'
        '201':
          description: 처음 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicOrder'
        '400':
          $ref: '#/components/responses/Error400'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
    get:
      operationId: listAdminOrders
      summary: 관리자 주문 목록
      tags: [관제]
      security:
      - adminToken: []
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
          minLength: 1
          maxLength: 256
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: 조회 또는 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/orders/lookup:
    post:
      operationId: lookupOwnOrder
      summary: 주문번호로 공개 상태 조회
      tags: [구매 웹]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderLookup'
      responses:
        '200':
          description: 조회 또는 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicOrder'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/orders/cancel:
    post:
      operationId: cancelOwnOrder
      summary: 수락 전 본인 주문 취소
      tags: [구매 웹]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicCancel'
      responses:
        '200':
          description: 조회 또는 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicOrder'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/auth/login:
    post:
      operationId: login
      summary: WPF 로그인
      tags: [인증]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: 조회 또는 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/auth/me:
    get:
      operationId: getSessionAccount
      summary: 세션 계정과 등급 조회
      tags: [인증]
      security:
      - adminToken: []
      responses:
        '200':
          description: 조회 또는 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: 로그아웃과 세션 철회
      tags: [인증]
      security:
      - adminToken: []
      responses:
        '204':
          description: 로그아웃됨
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/orders/{order_id}:
    get:
      operationId: getAdminOrder
      summary: 관리자 주문 상세
      tags: [관제]
      security:
      - adminToken: []
      parameters:
      - in: path
        name: order_id
        required: true
        schema:
          $ref: '#/components/schemas/Id'
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
      responses:
        '200':
          description: 조회 또는 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrder'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/orders/{order_id}/accept:
    post:
      operationId: approveOrder
      summary: 제작 수락과 대기 순번 부여
      tags: [관제]
      security:
      - adminToken: []
      parameters:
      - in: path
        name: order_id
        required: true
        schema:
          $ref: '#/components/schemas/Id'
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Request'
      responses:
        '200':
          description: 조회 또는 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrder'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-allowed-roles: [ADMIN, SUPER_ADMIN]
  /api/v1/orders/{order_id}/cancel:
    post:
      operationId: cancelQueuedOrder
      summary: 배출 전 대기 주문 취소
      tags: [관제]
      security:
      - adminToken: []
      parameters:
      - in: path
        name: order_id
        required: true
        schema:
          $ref: '#/components/schemas/Id'
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Request'
      responses:
        '200':
          description: 조회 또는 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrder'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-allowed-roles: [ADMIN, SUPER_ADMIN]
  /api/v1/orders/{order_id}/history:
    get:
      operationId: getOrderHistory
      summary: 주문별 오류·검사·이송 이력
      tags: [관제]
      security:
      - adminToken: []
      parameters:
      - in: path
        name: order_id
        required: true
        schema:
          $ref: '#/components/schemas/Id'
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
      - in: query
        name: cursor
        schema:
          type: string
          minLength: 1
          maxLength: 256
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: 조회 또는 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/pallets:
    get:
      operationId: listPallets
      summary: 팔레트 현재 배정
      tags: [관제]
      security:
      - adminToken: []
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
          minLength: 1
          maxLength: 256
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: 조회 또는 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PalletPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/plant:
    get:
      operationId: getPlant
      summary: 공정·연결 상태와 마지막 갱신
      tags: [관제]
      security:
      - adminToken: []
      responses:
        '200':
          description: 조회 또는 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plant'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/plant/actions:
    post:
      operationId: actOnPlant
      summary: 자동 운전 시작·전체 정지·해제
      tags: [관제]
      security:
      - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlantAction'
      responses:
        '202':
          description: 요청이 접수됨. 실제 완료는 상태·이력으로 확인한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantTicket'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-allowed-roles: [ADMIN, SUPER_ADMIN]
  /api/v1/plant/actions/{request_id}:
    get:
      operationId: getPlantAction
      summary: 전체 장비 정지·재개 처리 확인
      tags: [관제]
      security:
      - adminToken: []
      parameters:
      - in: path
        name: request_id
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: 조회 또는 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantTicket'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/cycles/{cycle_id}/qr-retry:
    post:
      operationId: retryQr
      summary: 동일 팔레트 재판독 또는 배정 저장 재시도
      tags: [관제]
      security:
      - adminToken: []
      parameters:
      - in: path
        name: cycle_id
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QrRetry'
      responses:
        '202':
          description: 요청이 접수됨. 실제 완료는 상태·이력으로 확인한다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrTicket'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/cycles/{cycle_id}/qr-retry/{request_id}:
    get:
      operationId: getQrRetry
      summary: QR 재시도 상태 조회
      tags: [관제]
      security:
      - adminToken: []
      parameters:
      - in: path
        name: cycle_id
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - in: path
        name: request_id
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: 조회 또는 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrTicket'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/inspections/{inspection_id}:
    get:
      operationId: getInspection
      summary: 검사 사유와 확정 목적지
      tags: [관제]
      security:
      - adminToken: []
      parameters:
      - in: path
        name: inspection_id
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: 조회 또는 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inspection'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/inspections/{inspection_id}/image:
    get:
      operationId: getInspectionImage
      summary: 저장된 검사 프레임
      tags: [관제]
      security:
      - adminToken: []
      parameters:
      - in: path
        name: inspection_id
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: 조회 또는 처리 결과
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Captured-At:
              schema:
                $ref: '#/components/schemas/Utc'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/cameras/{camera_id}/frame:
    get:
      operationId: getLatestFrame
      summary: WPF 카메라 현재 프레임
      tags: [관제]
      security:
      - adminToken: []
      parameters:
      - in: path
        name: camera_id
        required: true
        schema:
          type: string
          enum: [CAM1, CAM2, CAM3, CAM4]
      responses:
        '200':
          description: 조회 또는 처리 결과
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Captured-At:
              schema:
                $ref: '#/components/schemas/Utc'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/commands/{command_id}/reconcile:
    post:
      operationId: reconcileCommand
      summary: 현장 확인 결과 기록
      tags: [관제]
      security:
      - adminToken: []
      parameters:
      - in: path
        name: command_id
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reconcile'
      responses:
        '200':
          description: 조회 또는 처리 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconcileResult'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/manual-actions:
    post:
      operationId: submitManualAction
      summary: 승인된 수동 조작 절차 요청
      tags: [관제]
      security:
      - adminToken: []
      requestBody:
        required: true
        content:
