<fieldset class="order-contact" id="order-payment">
  <legend>결제 정보</legend>
  <div class="order-contact-fields">
    <label for="payment-method">결제 수단</label>
    <select id="payment-method" name="payment_method" required>
      <option value="">결제 수단 선택</option>
      <option value="card">신용카드</option>
      <option value="transfer">계좌이체</option>
    </select>
    <label for="card-issuer" hidden>카드사</label>
    <select id="card-issuer" name="card_issuer" required disabled hidden>
      <option value="">카드사 선택</option>
      $issuers
    </select>
    <label for="use-installments" hidden>할부 결제</label>
    <input id="use-installments" type="checkbox" disabled hidden>
    <label for="installment-months" hidden>할부 개월</label>
    <input id="installment-months" name="installment_months" type="number" min="2" step="1"
      max="9007199254740991" placeholder="2개월 이상" required disabled hidden>
    <label for="payment-bank" hidden>이체 은행</label>
    <select id="payment-bank" name="payment_bank" required disabled hidden>
      <option value="">은행 선택</option>
      $banks
    </select>
  </div>
</fieldset>
